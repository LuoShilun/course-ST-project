[pytest]
testpaths = member_lsl
            member_xyf
python_files = test_*.py

pythonpath = .
             ../web_system/backend
addopts = -v -ra --strict-markers --junitxml=reports/junit.xml
markers =
    case(case_id): link to the case id in Appendix 1 (test case list)
    api: API level automated case
    ui: browser UI automated case
    defect: defect confirmation case (expected to fail until the bug is fixed)
    unit: code module test case
    ai: case produced/assisted by AI (module 2, plan B "AI tests")
